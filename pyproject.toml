[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finathink"
version = "0.1.0"
description = "Finathink — Financial Research Optimizer for governed, auditable research"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4"]

[project.scripts]
finahinking = "finahinking.local_app:main"
finathink = "finahinking.local_app:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "playwright>=1.61,<1.62"]
research = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
math = ["sympy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finahinking = ["_package_data/migrations/*.sql", "_package_data/fixtures/**/*", "_package_data/assets/*.jpg", "_package_data/assets/*.js", "_package_data/assets/katex/*.css", "_package_data/assets/katex/fonts/*.woff2", "_package_data/assets/katex/fonts/*.woff", "_package_data/assets/katex/fonts/*.ttf"]
"finahinking.p8_2b" = ["content/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
