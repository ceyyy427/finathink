name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-release:
    name: Frontend build and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINATHINK_REQUIRE_BROWSER: '1'
      FINATHINK_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/browser-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests and parser performance
        working-directory: frontend
        run: |
          npm test
          npm run perf --silent | tee parser-performance.json
      - name: Build and verify committed browser bundle
        run: |
          npm --prefix frontend run build
          git diff --exit-code -- site/assets/finathink-research.js src/finahinking/_package_data/assets/finathink-research.js
      - name: Install browser test runtime
        run: |
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps --only-shell chromium
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends fonts-wqy-microhei
      - name: Required browser and HTTP journeys
        run: python -m pytest tests/p7_5/test_e2e.py tests/p7_5/test_phase4_browser.py tests/p7_5/test_phase5_browser.py tests/p7_5/test_phase6_browser.py tests/p7_5/test_phase7_browser.py tests/p7_5/test_phase8_browser.py tests/p7_5/test_phase9_browser.py tests/p7_5/test_phase10_browser.py tests/p7_5/test_phase15_browser.py tests/p7_5/test_phase16_browser.py tests/p7_5/test_phase17_browser.py tests/p7_5/test_phase18_browser.py tests/p7_5/test_phase19_browser.py tests/p7_5/test_phase20_browser.py tests/p7_5/test_phase21_browser.py tests/p7_5/test_phase22_browser.py tests/p7_5/test_phase24_browser.py -q --junitxml=browser-results.xml
      - name: Save screenshots, diagnostics, performance and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ env.FINATHINK_BROWSER_ARTIFACT_DIR }}/
            frontend/parser-performance.json
            browser-results.xml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Ruff
        run: ruff check src tests scripts
      - name: Governance and dependency checks
        run: |
          python scripts/validate_quant_knowledge.py
          python scripts/evaluate_knowledge_search.py --split all
          python scripts/validate_governance.py .
          python -m pip check
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --strict --progress-spinner off
          python scripts/prepare_release.py --check
          python scripts/secret_scan.py
      - name: Build smoke
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/finathink-wheel .
          python scripts/clean_install.py --wheel "$(find /tmp/finathink-wheel -name 'finathink-*.whl' -print -quit)"
      - name: Diff whitespace
        run: git diff --check

  quant-and-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research and quant dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,research]' statsmodels==0.15.0
      - name: Quant dependency and SQLite migration smoke
        run: |
          python -m pip check
          python -c "import sqlite3; from finahinking.p6_5.repository import apply_migration; from finahinking.p7 import apply_p7_migration; c=sqlite3.connect(':memory:'); apply_migration(c); apply_p7_migration(c)"
          python -c "import pandas as pd; from finahinking.quant.adapters.statsmodels_adapter import StatsmodelsAdapter; print(StatsmodelsAdapter().fit_ols(pd.DataFrame({'y':[1.,2.,3.], 'x':[0.,1.,2.]}), 'y', ['x']).fingerprint)"
      - name: PostgreSQL migration gate
        run: bash scripts/verify_p6_5_postgres.sh

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev,research]'
      - name: Notebook gate
        run: python -m jupyter nbconvert --to notebook --execute --output /tmp/finathink_research_workflow_executed.ipynb notebooks/01_research_workflow.ipynb
