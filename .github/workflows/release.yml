name: Release

on:
  push:
    tags:
      - 'v0.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Validate release metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,research]'
          python -m pip install pip-audit==2.10.1
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python scripts/prepare_release.py --check --tag "${GITHUB_REF_NAME}"
          else
            python scripts/prepare_release.py --check
          fi
          python -m pytest -q
          ruff check src tests scripts
          python scripts/validate_governance.py .
          python scripts/secret_scan.py
          python -m pip check
          pip-audit -r requirements.lock --strict --progress-spinner off
          python -m jupyter nbconvert --to notebook --execute --output /tmp/finathink_research_workflow_executed.ipynb notebooks/01_research_workflow.ipynb
          bash scripts/verify_p6_5_postgres.sh
      - name: Build source artifacts
        run: |
          rm -rf dist
          python -m pip wheel --no-deps --wheel-dir dist .
          python scripts/clean_install.py --wheel "$(find dist -name 'finathink-*.whl' -print -quit)" --examples-output dist/finathink-phase33-examples.zip
          git archive --format=tar.gz --output="dist/finathink-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_SHA"
          (cd dist && sha256sum -- ./*.whl ./*.tar.gz ./*.zip > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  portable-replay:
    needs: build
    uses: ./.github/workflows/replay-examples.yml
    with:
      artifact: release-dist

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: portable-replay
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
